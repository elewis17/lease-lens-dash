name: Agent workflow regression checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_agent_workflows.py'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -p test_agent_workflows.py -v
