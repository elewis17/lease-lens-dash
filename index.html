<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("theme"); } catch {}
        const theme = preference === "dark" || preference === "light"
          ? preference : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealStack</title>
    <meta name="description" content="Track rental performance, compare capital opportunities, and underwrite acquisitions in DealStack." />
    <meta name="author" content="DealStack" />
    <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221F1B" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="DealStack" />
    <meta property="og:description" content="Track rental performance, compare capital opportunities, and underwrite acquisitions in DealStack." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%dealstack.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
